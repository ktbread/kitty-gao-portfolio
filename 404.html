<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost cat — Kitty Gao</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 24px; gap: 22px; }
    .lost-code { display: flex; align-items: center; gap: 0.08em; font-family: var(--serif); font-size: clamp(110px, 22vw, 220px); line-height: 1; color: var(--ink); }
    .lost-cat { width: 0.86em; height: 0.86em; animation: look-around 3.2s ease-in-out infinite; transform-origin: 50% 85%; }
    @keyframes look-around { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(-9deg); } 45% { transform: rotate(8deg) translateY(-4px); } 70% { transform: rotate(-3deg); } }
    .lost h1 { font-size: clamp(34px, 5vw, 52px); }
    .lost p { margin: 0; font-size: 18px; color: var(--stone); max-width: 34ch; }
    .lost-links { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; font-size: 15px; }
    .lost-poster { border: 2px dashed var(--line); border-radius: 8px; padding: 14px 20px; background: var(--paper); font-size: 14px; color: var(--stone); transform: rotate(-2deg); }
    .lost-poster strong { display: block; font-family: var(--serif); font-size: 20px; color: var(--klein); letter-spacing: 0.04em; }
    @media (prefers-reduced-motion: reduce) { .lost-cat { animation: none; } }
  </style>
</head>
<body>
  <main class="lost">
    <div class="lost-code" aria-label="404">
      <span aria-hidden="true">4</span>
      <img class="lost-cat" src="/assets/icon.svg" alt="" aria-hidden="true">
      <span aria-hidden="true">4</span>
    </div>
    <h1>This page wandered off.</h1>
    <p>Cats do that. Let’s get you back somewhere familiar.</p>
    <a class="btn btn-primary" href="/">Take me home</a>
    <div class="lost-links">
      <a href="/#work">Posters</a>
      <a href="/#logo-story">Process</a>
      <a href="/#about">About</a>
    </div>
    <div class="lost-poster" aria-hidden="true"><strong>LOST CAT</strong>Answers to “kitty”. Last seen near a broken link.</div>
  </main>
</body>
</html>
